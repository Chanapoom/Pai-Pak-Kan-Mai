  <style>
    :root{--paper:#faf3e5;--ink:#13271a;--ink-2:#364e3e;--persimmon:#b64e10}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:1.5rem 1rem;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;line-height:1.6;text-align:center}

    img{width:9rem;height:auto}
    h1{margin:.2rem 0 0;font-size:1.75rem;line-height:1.3}
    p{margin:0;color:var(--ink-2)}
    a{display:inline-flex;align-items:center;min-height:2.75rem;margin-top:.8rem;padding:0 1.2rem;border:1.5px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;box-shadow:3px 3px 0 var(--persimmon)}

  </style>
</head>
<body>
